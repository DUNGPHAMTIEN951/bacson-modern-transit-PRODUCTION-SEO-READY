name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify production build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format demo layout code in isolated PR
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/bscn-demo-layout-real-photos-20261022'
        run: |
          npx prettier --write src/components/site/Hero.tsx src/components/site/Header.tsx src/components/site/TravelTrust.tsx src/components/site/PromotionCampaign.tsx src/routes/index.tsx scripts/qa/production-smoke.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ scripts/qa/
          if ! git diff --cached --quiet; then
            git commit -m "style: format demo-inspired homepage"
            git push origin HEAD:feat/bscn-demo-layout-real-photos-20261022
          fi

      - name: Verify
        run: npm run verify
        env:
          VITE_BOOKING_FORM_ENDPOINT: https://script.google.com/macros/s/CI_PLACEHOLDER/exec
