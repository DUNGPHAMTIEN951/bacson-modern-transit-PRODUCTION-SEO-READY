name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify production build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify
        run: npm run verify

      - name: Check whether Cloudflare deploy credentials are configured
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then echo "CLOUDFLARE_API_TOKEN=present"; else echo "CLOUDFLARE_API_TOKEN=missing"; fi
          if [ -n "$CF_API_TOKEN" ]; then echo "CF_API_TOKEN=present"; else echo "CF_API_TOKEN=missing"; fi
          if [ -n "$CLOUDFLARE_API_KEY" ]; then echo "CLOUDFLARE_API_KEY=present"; else echo "CLOUDFLARE_API_KEY=missing"; fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
        env:
          VITE_BOOKING_FORM_ENDPOINT: https://script.google.com/macros/s/CI_PLACEHOLDER/exec
