name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify production build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format promotion source (temporary)
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/bscn-universal-20pct-hospital-roundtrip-20261021'
        run: |
          npx prettier --write src/components/site/PromotionCampaign.tsx src/components/site/BookingConsultationForm.tsx src/components/site/BookingModal.tsx src/components/site/Fares.tsx src/data/fares.ts src/data/business.ts src/types/booking.ts src/routes/index.tsx src/routes/uu-dai-kham-benh.tsx
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/
          if ! git diff --cached --quiet; then
            git commit -m "chore: format promotion components"
            git push origin HEAD:feat/bscn-universal-20pct-hospital-roundtrip-20261021
          fi

      - name: Verify
        run: npm run verify
        env:
          VITE_BOOKING_FORM_ENDPOINT: https://script.google.com/macros/s/CI_PLACEHOLDER/exec
