name: Production smoke / screenshots
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
    paths:
      - 'scripts/qa/production-smoke.mjs'
      - '.github/workflows/production-smoke.yml'
permissions:
  contents: write
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Format QA script (one-time)
        if: github.event_name == 'pull_request' && github.head_ref == 'qa/production-e2e-20261021'
        run: |
          npx prettier --write scripts/qa/production-smoke.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/qa/production-smoke.mjs
          if ! git diff --cached --quiet; then
            git commit -m "style: format smoke E2E test"
            git push origin HEAD:qa/production-e2e-20261021
          fi
      - name: Check Chrome installation
        id: chrome
        shell: bash
        run: |
          if command -v google-chrome >/dev/null; then
            echo "binary=$(command -v google-chrome)" >> "$GITHUB_OUTPUT"
          elif command -v chromium >/dev/null; then
            echo "binary=$(command -v chromium)" >> "$GITHUB_OUTPUT"
          else
            npx playwright-core install chromium
            echo "binary=$(find "$HOME/.cache/ms-playwright" -type f -name chrome -o -name chrome-headless-shell | head -1)" >> "$GITHUB_OUTPUT"
          fi
      - name: Production smoke (POST mocked, no real booking)
        run: node scripts/qa/production-smoke.mjs
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.binary }}
          PROD_BASE_URL: https://xekhachbaccuongnguyet.com
      - name: Upload screenshots and QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bscn-production-smoke
          path: qa-results/
          if-no-files-found: warn
          retention-days: 7
